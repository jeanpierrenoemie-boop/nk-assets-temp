<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo Agent WhatsApp — Yao Communication</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#0b141a; min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  .head { background:#1f2c33; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; border-radius:50%; background:#c9a25f; color:#1f2c33; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  .who { color:#e9edef; font-weight:700; font-size:15px; }
  .who small { display:block; font-weight:400; font-size:11.5px; color:#25d366; }
  .chat { flex:1; overflow-y:auto; padding:16px 12px; background:#0b141a; }
  .msg { max-width:80%; padding:9px 12px; border-radius:10px; font-size:14px; line-height:1.45; margin-bottom:8px; color:#e9edef; }
  .in { background:#202c33; border-top-left-radius:2px; }
  .out { background:#005c4b; margin-left:auto; border-top-right-radius:2px; }
  .foot { background:#1f2c33; padding:12px; text-align:center; }
  .btn { background:#25d366; color:#0b141a; border:0; border-radius:24px; padding:13px 28px; font-size:14.5px; font-weight:800; cursor:pointer; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-top:4px; font-weight:700; }
  .lead { background:#1a3a2a; color:#25d366; border:1px solid #25d366; }
  .note { max-width:420px; margin:0 auto; padding:14px 18px 30px; font-size:11.5px; color:#7d8890; text-align:center; line-height:1.6; }
  .card { max-width:420px; margin:0 auto; background:#1f262c; border:1px solid #3d4a55; border-radius:12px; padding:18px; margin-bottom:14px; }
  .card h3 { color:#c9a25f; font-size:14px; margin-bottom:10px; }
  .card p { font-size:13px; color:#c9c4b9; line-height:1.55; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="avatar">YC</div>
    <div class="who">Agent Yao Communication<small>en ligne</small></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="foot"><button class="btn" id="next" onclick="next()">Simuler un nouveau contact</button></div>
</div>
<div class="note">Démo présentée par Noémie K · NK-SYSTEMS.IA<br>Simulation du message de bienvenue automatique et de la qualification d'un nouveau contact.</div>

<div style="max-width:420px;margin:0 auto;padding:0 18px 40px;">
  <div class="card hidden" id="resCard">
    <h3>Ce que Ila reçoit automatiquement</h3>
    <p id="resTxt"></p>
  </div>
</div>

<script>
const steps=[
 {t:'in', txt:'Bonjour et bienvenue chez Yao Communication 👋 Je suis l\'assistante virtuelle de Ila.'},
 {t:'in', txt:'Pour que Ila puisse vous aider au mieux, 3 petites questions : vous occupez une position de dirigeant(e) ? 🏢'},
 {t:'out',txt:'Oui, je dirige une PME de 12 personnes'},
 {t:'in', txt:'Parfait ! Parmi ces services, lequel vous intéresse : audit, création graphique ou carte de visite digitale ? 🎯'},
 {t:'out',txt:'Un audit de ma présence en ligne'},
 {t:'in', txt:'D\'accord. Et à quelle échéance souhaitez-vous démarrer ? 📅'},
 {t:'out',txt:'Moins de 15 jours'},
 {t:'in', txt:'Merci ! ✅ Ila reçoit votre fiche et vous propose un créneau très vite. Bonne journée !'},
];
let i=0;
function next(){
  document.getElementById('resCard').classList.add('hidden');
  document.getElementById('chat').innerHTML='';
  i=0; play();
  document.getElementById('next').textContent='Rejouer la simulation';
}
function play(){
  if(i>=steps.length){
    const c=document.getElementById('resCard');
    document.getElementById('resTxt').innerHTML='<span class="badge lead">PROSPECT QUALIFIÉ</span><br><br><b>Dirigeante PME 12 pers.</b> · besoin : <b>audit présence en ligne</b> · urgence : <b>moins de 15 jours</b> → à rappeler en priorité.<br><br>Dans la version finale, ce résumé arrive automatiquement sur le WhatsApp de Ila, et le contact est classé (prospect / à écarter / suspect).';
    c.classList.remove('hidden');
    return;
  }
  const s=steps[i++];
  const d=document.createElement('div');
  d.className='msg '+s.t; d.textContent=s.txt;
  const chat=document.getElementById('chat');
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  setTimeout(play, i===1?900:700);
}
</script>
</body>
</html>
